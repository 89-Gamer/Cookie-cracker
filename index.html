<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cookie Cracker</title>
<style>
  :root{
    --bg:#16233b; --ink:#ffffff; --muted:#9db0cf;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1.2rem;overflow:hidden;user-select:none;-webkit-user-select:none;
    padding:env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
    touch-action:manipulation;
  }
  h1{margin:0;font-size:clamp(1.1rem,3.5vw,1.5rem);font-weight:700;letter-spacing:.02em;color:var(--muted)}
  #count{
    font-size:clamp(3.5rem,16vw,8rem);font-weight:800;line-height:1;
    font-variant-numeric:tabular-nums;margin:0;
  }
  #count.bump{animation:bump .12s ease-out}
  @keyframes bump{from{transform:scale(1.12)}to{transform:scale(1)}}
  #cookie{
    position:relative;width:min(90vw,560px);aspect-ratio:var(--ratio,1.7);
    cursor:pointer;touch-action:none;outline:none;
  }
  #cookie img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
  #cookie .cracked{visibility:hidden}
  #cookie.down .cracked{visibility:visible}
  #cookie.down .whole{visibility:hidden}
  #cookie.down{transform:scale(.97)}
  #cookie:focus-visible{outline:3px solid var(--muted);outline-offset:6px;border-radius:24px}
  .hint{margin:0;color:var(--muted);font-size:.95rem;text-align:center}
  #reset{
    position:fixed;right:max(.8rem,env(safe-area-inset-right));bottom:max(.8rem,env(safe-area-inset-bottom));
    background:none;border:1px solid #3a4c6e;color:var(--muted);border-radius:8px;padding:.4rem .7rem;font:inherit;font-size:.8rem;cursor:pointer
  }
  #mute{
    position:fixed;left:max(.8rem,env(safe-area-inset-left));bottom:max(.8rem,env(safe-area-inset-bottom));
    background:none;border:1px solid #3a4c6e;color:var(--muted);border-radius:8px;padding:.4rem .7rem;font:inherit;font-size:.8rem;cursor:pointer
  }
  @media (prefers-reduced-motion:reduce){#count.bump{animation:none}#cookie.down{transform:none}}
</style>
</head>

  </div>
  <p class="hint">Click, tap, or hold the spacebar</p>
  <button id="mute" type="button">Sound: on</button>
  <button id="reset" type="button">Reset score</button>

<script>
(function(){
  var cookie=document.getElementById('cookie'),
      countEl=document.getElementById('count'),
      muteBtn=document.getElementById('mute'),
      resetBtn=document.getElementById('reset');
  var KEY='cookieCracker.count', MUTE='cookieCracker.mute';
  var count=0, muted=false;
  try{count=parseInt(localStorage.getItem(KEY),10)||0;muted=localStorage.getItem(MUTE)==='1';}catch(e){}
  function render(){countEl.textContent=count.toLocaleString();}
  function save(){try{localStorage.setItem(KEY,String(count));}catch(e){}}
  function setMute(){muteBtn.textContent='Sound: '+(muted?'off':'on');try{localStorage.setItem(MUTE,muted?'1':'0');}catch(e){}}
  render();setMute();

  // keep layout ratio matched to the image
  var img=cookie.querySelector('.whole');
  function ratio(){if(img.naturalWidth)cookie.style.setProperty('--ratio',img.naturalWidth/img.naturalHeight);}
  img.complete?ratio():img.addEventListener('load',ratio);

  // crunch sound, synthesized (no audio files needed)
  var ac=null;
  function crunch(){
    if(muted)return;
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended')ac.resume();
      var len=Math.floor(ac.sampleRate*0.09),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
      for(var i=0;i<len;i++){var t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,3)*(Math.random()>0.55?1:0.35);}
      var src=ac.createBufferSource();src.buffer=buf;
      var f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800+Math.random()*1600;f.Q.value=0.8;
      var g=ac.createGain();g.gain.value=0.7;
      src.connect(f);f.connect(g);g.connect(ac.destination);src.start();
    }catch(e){}
  }

  var held={};
  function sync(){cookie.classList.toggle('down',Object.keys(held).length>0);}
  function press(id){
    held[id]=true;sync();               // always count, never ignore a press
    count++;render();save();crunch();
    countEl.classList.remove('bump');void countEl.offsetWidth;countEl.classList.add('bump');
  }
  function release(id){delete held[id];sync();}

  cookie.addEventListener('pointerdown',function(e){
    e.preventDefault();
    press('p'+e.pointerId);
  });
  // listen on window so a release outside the cookie is never missed
  ['pointerup','pointercancel'].forEach(function(n){
    window.addEventListener(n,function(e){release('p'+e.pointerId);});
  });
  cookie.addEventListener('contextmenu',function(e){e.preventDefault();});
  cookie.addEventListener('dragstart',function(e){e.preventDefault();});

  window.addEventListener('keydown',function(e){
    if(e.target===muteBtn||e.target===resetBtn)return;
    if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)press('k'+e.code);}
  });
  window.addEventListener('keyup',function(e){
    if(e.code==='Space'||e.code==='Enter')release('k'+e.code);
  });
  window.addEventListener('blur',function(){held={};sync();});
  document.addEventListener('visibilitychange',function(){held={};sync();});

  muteBtn.addEventListener('click',function(){muted=!muted;setMute();});
  resetBtn.addEventListener('click',function(){
    if(confirm('Reset your score to 0?')){count=0;render();save();}
  });
})();
</script>
